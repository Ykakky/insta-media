<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>カルーセル台紙</title>
<!-- 和文フォント（Noto Sans JP Light）。unicode-range で分割され、使う文字を含む断片だけ読み込まれる -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 段階（行き来できる） -->
<nav class="steps" id="steps">
  <button data-step="photos">1 写真</button>
  <button data-step="layout">2 編集</button>
  <button data-step="text">3 文字</button>
  <button data-step="export">4 書き出し</button>
</nav>

<!-- 1〜2. 写真を選んで並べる -->
<section id="screen-photos" class="screen active">
  <h1>写真を選んで、並べる</h1>
  <p class="hint">選んだ順に並びます。ドラッグで入れ替えると、その順がカルーセルの順になります。</p>
  <label class="file-button">
    写真を追加
    <input type="file" id="file-input" accept="image/*" multiple>
  </label>
  <div id="order-grid" class="order-grid"></div>
  <div class="row sticky-bottom">
    <button id="back-to-edit" class="sub" hidden>編集に戻る</button>
    <button id="build-btn" disabled>この順で組む</button>
  </div>
  <details class="log-box"><summary>読み込みの記録（HEIC・向きの確認用）</summary>
    <div id="load-log" class="log"></div>
  </details>
</section>

<!-- 4〜5. コマごとの編集・文字入れ（台紙は共通） -->
<section id="screen-editor" class="screen">
  <div class="toolbar">
    <span class="stage-title" id="stage-title"></span>
    <button id="preview-btn" class="sub">プレビュー</button>
    <button id="next-btn">次へ</button>
  </div>

  <!-- 写真プール（編集のみ）：タップで選んで、台紙の写真をタップで差し替え -->
  <div id="pool" class="pool" data-stage="layout"></div>
  <input type="file" id="pool-input" accept="image/*" multiple hidden>

  <div id="board-wrap">
    <canvas id="board"></canvas>
  </div>
  <div class="view-bar">
    <button id="frame-prev" class="sub" aria-label="前のコマ">‹</button>
    <span class="sel-info" id="sel-info"></span>
    <button id="frame-next" class="sub" aria-label="次のコマ">›</button>
    <button id="zoom-toggle" class="sub">全体</button>
  </div>
  <p class="hint" id="editor-hint"></p>

  <!-- ===== コマ編集：写真の色調・背景色・配置を1画面に ===== -->
  <div data-stage="layout">
    <section class="panel">
      <h2 id="tone-title">写真の色調</h2>
      <div class="chips" id="tone-chips"></div>
      <div class="chips small" id="strength-chips"></div>
      <div class="label">単色に乗せる色（基調色・投稿全体）</div>
      <div class="swatches" id="accent-swatches"></div>
      <div class="btn-row"><button id="tone-all" class="sub">この色調を全部の写真に</button></div>
    </section>

    <section class="panel">
      <h2 id="bg-title">背景色</h2>
      <div class="swatches" id="bg-swatches"></div>
      <div class="hsl">
        <label>色相<input type="range" id="bg-h" min="0" max="360"></label>
        <label>彩度<input type="range" id="bg-s" min="0" max="100"></label>
        <label>明度<input type="range" id="bg-l" min="0" max="100"></label>
      </div>
      <div class="btn-row">
        <span class="hex" id="bg-hex"></span>
        <button id="bg-all" class="sub">この色を全コマの背景に</button>
      </div>
    </section>

    <section class="panel">
      <h2>配置</h2>
      <div class="seg" id="mode-seg">
        <button data-mode="free" class="on">自由設計</button>
        <button data-mode="grid">マス設計</button>
      </div>
      <div class="btn-row">
        <button id="add-window" class="sub">写真を置く</button>
        <button id="to-front" class="sub">前面へ</button>
        <button id="del-part" class="sub">選択を削除</button>
      </div>
      <div class="btn-row">
        <button id="add-frame" class="sub">後ろにコマを追加</button>
        <button id="del-frame" class="sub">このコマを削除</button>
      </div>
      <div class="btn-row">
        <button id="shuffle-btn" class="sub">振り直し（写真の割り当てを入れ替え）</button>
      </div>
    </section>

    <!-- カセット：常に画面下に並ぶ。タップで即適用（出発点のパターン） -->
    <div class="cassette-dock" id="cassette-dock"></div>
  </div>

  <!-- ===== 文字入れ ===== -->
  <div data-stage="text">
    <div class="btn-row"><button id="add-text">文字を追加</button></div>
    <section class="panel" id="text-panel">
      <textarea id="text-input" rows="3" placeholder="文字を入力"></textarea>
      <div class="counter" id="text-count"></div>
      <div class="label">級数</div>
      <div class="seg" id="text-role"></div>
      <div class="label">文字色</div>
      <div class="chips" id="text-color"></div>
      <div class="label">揃え</div>
      <div class="seg" id="text-align"></div>
      <div class="btn-row"><button id="del-text" class="sub">この文字を削除</button></div>
    </section>
  </div>
</section>

<!-- 6. 書き出し -->
<section id="screen-export" class="screen">
  <div class="toolbar">
    <button id="export-back" class="sub">文字入れに戻る</button>
    <button id="share-btn" class="sub">共有シート</button>
  </div>
  <p class="hint">画像を長押し →「"写真"に保存」。</p>
  <div id="export-list"></div>
</section>

<!-- プレビュー（投稿画面に似せたダミーの枠。編集はしない） -->
<div id="preview" class="preview" hidden>
  <div class="pv-card">
    <div class="pv-head">
      <span class="pv-avatar"></span>
      <span class="pv-name">your_account</span>
      <span class="pv-more">···</span>
      <button id="preview-close" class="pv-close" aria-label="閉じる">×</button>
    </div>
    <div class="pv-track" id="pv-track"></div>
    <div class="pv-actions">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3.2 4.5 6.9 4.5c2.1 0 3.6 1.2 5.1 3 1.5-1.8 3-3 5.1-3 3.7 0 6 3.8 4.5 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M20.5 11.5a8.5 8.5 0 1 1-3.3-6.7 8.5 8.5 0 0 1 3.3 6.7zM20.5 11.5 22 21l-5-2.5"/></svg>
      <svg viewBox="0 0 24 24"><path d="M22 3 2 10l8 3 3 8z M10 13l12-10"/></svg>
      <span class="pv-dots" id="pv-dots"></span>
      <svg viewBox="0 0 24 24" class="pv-save"><path d="M5 3h14v18l-7-5-7 5z"/></svg>
    </div>
    <div class="pv-caption"><b>your_account</b> キャプションが入ります</div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/model.js"></script>
<script src="js/loader.js"></script>
<script src="js/render.js"></script>
<script src="js/editor.js"></script>
<script src="js/ui.js"></script>
<script src="js/panels.js"></script>
<script src="js/textui.js"></script>
<script src="js/preview.js"></script>
<script>startApp();</script>
</body>
</html>
